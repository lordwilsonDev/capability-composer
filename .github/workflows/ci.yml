name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: deps
        run: pip install --quiet pytest ruff

      - name: tests (20 — sandbox scenarios + reuse)
        run: python -m pytest tests/ -q

      - name: ruff (E9,F,I)
        run: python -m ruff check --select E9,F,I composer.py registry/ primitives/ skills/ tests/

      - name: sandbox verify — 10 adversarial scenarios, zero spend
        run: python skills/gohighlevel_lead_qualifier/qualifier.py

      - name: composer loop — run #1 composes + registers (status VERIFIED)
        run: |
          OUT=$(python composer.py run "create a ghl lead qualification agent")
          echo "$OUT"
          echo "$OUT" | grep -q "\[7/7\] register"
          echo "$OUT" | grep -q "status=VERIFIED"

      - name: composer loop — run #2 must REUSE, never rebuild (Law 1)
        run: |
          OUT=$(python composer.py run "create a ghl lead qualification agent")
          echo "$OUT"
          echo "$OUT" | grep -q "REUSE (Law 1)"
          if echo "$OUT" | grep -q "\[7/7\]"; then
            echo "FAIL: second request re-ran the build path"
            exit 1
          fi
